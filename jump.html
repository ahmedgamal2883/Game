<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>نطّة المعرفة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
:root{--ink:#22163f;--card:#fffaf0;--good:#2ecc71;--bad:#ff5468;--gold:#ffc83d;--accent:#7b5cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1b1240;font-family:"Baloo Bhaijaan 2",system-ui,Tahoma,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{background:#ffffffe6;border-radius:999px;padding:4px 14px;font-weight:800;font-size:18px;box-shadow:0 3px 0 #0003;display:flex;gap:6px;align-items:center}
#lives{color:var(--bad);letter-spacing:2px}
#q{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--card);border-radius:18px;padding:12px 16px;text-align:center;font-weight:700;font-size:19px;line-height:1.35;box-shadow:0 6px 0 #0004;direction:ltr;transition:transform .4s cubic-bezier(.3,1.7,.5,1),opacity .25s}
#q.out{transform:translateX(-50%) translateY(-20px) scale(.85);opacity:0}
#q small{display:block;font-size:13px;color:#8a7fb0;font-weight:500;direction:rtl}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-left,0px));text-align:center;background:radial-gradient(circle at 50% 30%,#3a2a8acc,#1b1240f2);color:#fff;overflow:auto}
.screen h1{font-size:clamp(42px,10vw,64px);line-height:1;color:var(--gold);text-shadow:0 5px 0 #c2410c;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.screen p{max-width:420px;line-height:1.7;opacity:.9}
button{font:inherit;font-weight:800;font-size:22px;background:var(--gold);color:var(--ink);border:0;border-radius:16px;padding:10px 40px;box-shadow:0 6px 0 #c2410c;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #c2410c}
button.sec{background:#ffffff22;color:#fff;box-shadow:0 4px 0 #0005;font-size:16px;padding:8px 22px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
textarea{width:min(560px,92vw);height:200px;font:14px monospace;padding:10px;border-radius:12px;border:0;direction:ltr}
#review{width:min(520px,92vw);text-align:left;direction:ltr;background:#ffffff14;border-radius:14px;padding:8px 14px;max-height:38vh;overflow:auto;line-height:1.5}
#review div{border-bottom:1px solid #ffffff22;padding:8px 0}
#review b{color:#7dffb0}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stats .chip{color:var(--ink)}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="chip" id="lives"></div><div class="chip" id="streak" style="visibility:hidden"></div><div class="chip" id="height">0 م</div></div>
<div id="q" class="out"></div>

<div id="menu" class="screen">
  <h1>نطّة المعرفة</h1>
  <p>اطلع لفوق بالإجابات الصح! كل صف فيه 3 منصات، اضغط على المنصة اللي عليها الإجابة الصح عشان تنط عليها.<br>المنصة الغلط بتتكسر وانت بتقع 😵</p>
  <p style="font-size:14px">الكمبيوتر: ⬅️ ⬇️ ➡️ أو 1 2 3 — الموبايل: المس المنصة</p>
  <div id="best"></div>
  <button id="play">يلا نطلع</button>
  <button class="sec" id="editBtn">أسئلتي</button>
</div>
<div id="editor" class="screen hidden">
  <h2>أسئلتك</h2>
  <p>كل سؤال في سطر: السؤال | الإجابة الصح | خطأ 1 | خطأ 2</p>
  <textarea id="qText"></textarea>
  <div style="display:flex;gap:10px"><button id="saveQ">حفظ</button><button class="sec" id="resetQ">الافتراضي</button></div>
</div>
<div id="over" class="screen hidden">
  <h1>وقعت!</h1>
  <div class="stats" id="final"></div>
  <h3 id="revTitle">راجع اللي غلطت فيه</h3>
  <div id="review"></div>
  <button id="again">حاول تاني</button>
  <button class="sec" id="home">القائمة</button>
</div>

<script>
// ===== Questions =====
const DEFAULT_Q=`Lower limb veins connecting superficial to deep veins? | Perforators | Capillaries | Lymphatics
First-line investigation for varicose veins? | Duplex US | Venography | MRI
Normal adult resting heart rate (bpm)? | 60-100 | 30-50 | 110-150
Largest organ of the body? | Skin | Liver | Brain
Insulin is secreted by? | Beta cells | Alpha cells | Delta cells
Normal fasting glucose (mg/dL)? | 70-100 | 140-180 | 30-50
Vitamin deficiency causing scurvy? | Vitamin C | Vitamin D | Vitamin K
Most common blood type? | O+ | AB- | B-
Longest bone in the body? | Femur | Tibia | Humerus
Normal respiratory rate (/min)? | 12-20 | 25-35 | 5-8
Universal donor blood group? | O- | AB+ | A+
Number of cranial nerves? | 12 | 10 | 31`;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const parseQ=t=>t.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p.length>=4&&p[0]).map(p=>({q:p[0],a:p[1],w:[p[2],p[3]],miss:0}));
let questions=parseQ(store.get('jq')||DEFAULT_Q);if(!questions.length)questions=parseQ(DEFAULT_Q);
let lastQ;function pickQ(){const pool=[];questions.forEach(q=>{for(let i=0;i<1+q.miss*2;i++)pool.push(q)});let q;do{q=pool[Math.random()*pool.length|0]}while(q===lastQ&&questions.length>1);return lastQ=q}

// ===== Sound =====
let AC;function snd(k){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 const tone=(f,d,w,v,f2,dl=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w;o.frequency.setValueAtTime(f,t+dl);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dl+d);g.gain.setValueAtTime(0,t);g.gain.setValueAtTime(v,t+dl);g.gain.exponentialRampToValueAtTime(.001,t+dl+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dl+d)};
 if(k==='jump')tone(260,.25,'sine',.15,620);
 if(k==='land')tone(140,.12,'triangle',.15,80);
 if(k==='good'){[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.1,0,i*.07))}
 if(k==='bad'){tone(420,.6,'sawtooth',.08,70);tone(90,.3,'square',.08,40,.15)}
 if(k==='crack')tone(1200,.15,'square',.05,200);
}catch(e){}}

// ===== Canvas =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=t=>1-Math.pow(1-t,3);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function mixC(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`}

// ===== World =====
// rows are spaced vertically; world y grows upward (row k at y = k*GAP)
const GAP=170;
let rows,cur,player,cam,state='menu',lives,streak,best,correct,wrong,mistakes,parts,floaters,shake,flash,clouds,starsBg,tPlay=0,pending;
const SKY=[ // [height, top, bottom]
 [0,'#7ad7ff','#d8f3ff'],[8,'#ff9a8b','#ffd29d'],[16,'#6a3fb5','#ff8fab'],[24,'#1b1240','#4b2a8a'],[34,'#05040f','#1b1240']];
function skyAt(h){for(let i=0;i<SKY.length-1;i++){const a=SKY[i],b=SKY[i+1];if(h<b[0]){const t=(h-a[0])/(b[0]-a[0]);return[mixC(a[1],b[1],t),mixC(a[2],b[2],t),t+i]}}const l=SKY[SKY.length-1];return[l[1],l[2],SKY.length]}

function laneX(i){const w=Math.min(W,560);return W/2+(i-1)*w*0.32}
function platW(){return Math.min(W*0.28,160)}
function makeRow(k){const q=k===0?null:pickQ();const ans=q?[q.a,...q.w].sort(()=>Math.random()-.5):null;
 return{k,q,ans,plats:[0,1,2].map(i=>({i,broken:0,glow:0,wob:Math.random()*6,shown:k===0?1:0})),solved:k===0}}
function reset(){rows=[makeRow(0),makeRow(1),makeRow(2)];cur=0;lives=3;streak=0;correct=0;wrong=0;mistakes=[];parts=[];floaters=[];shake=0;flash=null;pending=null;
 player={lane:1,x:laneX(1),y:0,vy:0,anim:null,sx:1,sy:1,face:'idle',blink:0,look:0,trail:[]};
 cam={y:0};best=+(store.get('jbest')||0);showQ();hud()}
function initBg(){clouds=Array.from({length:14},()=>({x:Math.random()*1.4-.2,y:Math.random()*30*GAP,s:.6+Math.random()*1.2,v:.005+Math.random()*.01}));
 starsBg=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,p:Math.random()*6}))}
initBg();

// ===== HUD / UI =====
const $=id=>document.getElementById(id);
function hud(){$('lives').textContent='♥'.repeat(lives)+'♡'.repeat(Math.max(0,3-lives));$('height').textContent=`${cur*5} م ⬆`;
 const s=$('streak');s.style.visibility=streak>=2?'visible':'hidden';s.textContent=`🔥 ${streak}`}
function showQ(){const r=rows[cur+1];const el=$('q');el.classList.add('out');setTimeout(()=>{el.innerHTML=`${r.q.q}<small>اختار المنصة الصح ⬆</small>`;el.classList.remove('out')},180)}

// ===== Input =====
function choose(i){if(state!=='play'||player.anim)return;const target=rows[cur+1];if(!target)return;
 player.anim={from:{x:player.x,y:player.y},to:{x:laneX(i),y:(cur+1)*GAP},t:0,dur:.62,lane:i,phase:'up'};player.sy=.6;player.sx=1.35;player.face='focus';snd('jump');
 for(let k=0;k<10;k++)parts.push({x:player.x,y:player.y,vx:(Math.random()-.5)*160,vy:Math.random()*80,life:.5,c:'#ffffffcc',r:4+Math.random()*4,g:0})}
addEventListener('keydown',e=>{const m={ArrowLeft:0,ArrowDown:1,ArrowUp:1,ArrowRight:2,'1':0,'2':1,'3':2}[e.key];if(m!==undefined){e.preventDefault();choose(m)}});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;const r=rows[cur+1];
 const sy=toScreen((cur+1)*GAP);let bestI=-1,bd=1e9;for(let i=0;i<3;i++){const d=Math.hypot(e.clientX-laneX(i),(e.clientY-sy)*.6);if(d<bd){bd=d;bestI=i}}
 if(bd<platW()*1.1)choose(bestI);else{ // tap anywhere: choose by column
  const w=Math.min(W,560);choose(clamp(Math.round((e.clientX-W/2)/(w*.32))+1,0,2))}});

function toScreen(wy){return H*0.72-(wy-cam.y)}

// ===== Resolve a landing =====
function land(){const a=player.anim;player.anim=null;const row=rows[cur+1];const p=row.plats[a.lane];
 player.x=a.to.x;player.y=a.to.y;player.lane=a.lane;player.sx=1.4;player.sy=.65;snd('land');
 const ok=row.ans[a.lane]===row.q.a;
 if(ok){row.solved=true;p.glow=1;streak++;correct++;row.q.miss=Math.max(0,row.q.miss-1);cur++;player.face='happy';snd('good');
  confetti(player.x,toScreen(player.y)-30,60);
  floaters.push({x:player.x,y:player.y+90,txt:streak>=3?`🔥 ×${streak}`:'صح!',c:'#2ecc71',life:1.2});
  row.plats.forEach((q,i)=>{if(i!==a.lane)q.fade=1});
  while(rows.length<cur+3)rows.push(makeRow(rows.length));
  showQ();
  if(cur*5>best){best=cur*5;store.set('jbest',best)}}
 else{streak=0;wrong++;row.q.miss++;if(!mistakes.includes(row.q))mistakes.push(row.q);p.broken=.001;snd('crack');player.face='dizzy';
  const right=row.ans.indexOf(row.q.a);row.plats[right].reveal=1;
  floaters.push({x:a.to.x,y:a.to.y+90,txt:'غلط!',c:'#ff5468',life:1.2});
  // fall back down
  setTimeout(()=>{player.anim={from:{x:player.x,y:player.y},to:{x:laneX(rows[cur].plats.length?player.lane:1),y:cur*GAP},t:0,dur:.55,lane:player.lane,phase:'fall'};snd('bad');shake=.4;flash='#ff5468';
   lives--;hud();if(lives<=0){setTimeout(gameOver,700)}else setTimeout(()=>{rows[cur+1]=makeRow(cur+1);showQ()},900)},280)}
 hud()}
function gameOver(){state='over';$('q').classList.add('out');
 $('final').innerHTML=`<div class="chip">⬆ ${cur*5} م</div><div class="chip">✅ ${correct}</div><div class="chip">❌ ${wrong}</div><div class="chip">⭐ أفضل ${best} م</div>`;
 const has=mistakes.length>0;$('revTitle').classList.toggle('hidden',!has);$('review').classList.toggle('hidden',!has);
 $('review').innerHTML=mistakes.map(q=>`<div>${q.q}<br>✔ <b>${q.a}</b></div>`).join('');$('over').classList.remove('hidden')}

function confetti(x,y,n){const cols=['#ff5468','#ffc83d','#2ecc71','#4dabff','#b36bff','#ff8fd1'];
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=200+Math.random()*380;parts.push({sx:x,sy:y,screen:true,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,life:1.4+Math.random()*.6,c:cols[i%6],r:5+Math.random()*5,g:700,rot:Math.random()*6,vr:(Math.random()-.5)*14,rect:true})}}

// ===== Drawing =====
function drawBg(dt){const h=cam.y/GAP;const[top,bot,phase]=skyAt(h);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // stars fade in when high
 const sa=clamp((phase-2)/1.5,0,1);if(sa>0){starsBg.forEach(s=>{const y=((s.y*H+cam.y*.05)%H+H)%H;ctx.globalAlpha=sa*(.5+.5*Math.sin(tPlay*2+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1}
 // sun / moon
 const sunY=H*.25+h*12;ctx.save();ctx.globalAlpha=clamp(1-h/20,0,1);const sg=ctx.createRadialGradient(W*.8,sunY,10,W*.8,sunY,90);sg.addColorStop(0,'#fff6c8');sg.addColorStop(.4,'#ffd86b88');sg.addColorStop(1,'#ffd86b00');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(W*.8,sunY,90,0,7);ctx.fill();ctx.restore();
 if(h>16){ctx.save();ctx.globalAlpha=clamp((h-16)/6,0,1);ctx.fillStyle='#f4f1ff';ctx.beginPath();ctx.arc(W*.2,H*.22,34,0,7);ctx.fill();ctx.fillStyle=top;ctx.beginPath();ctx.arc(W*.2+14,H*.22-8,30,0,7);ctx.fill();ctx.restore()}
 // far hills (parallax) near the ground
 const hillY=toScreen(0)*.35+H*.65+cam.y*.3;if(hillY<H+200){ctx.fillStyle='#8ed6a7';ctx.beginPath();ctx.moveTo(0,H+300);for(let x=0;x<=W;x+=20)ctx.lineTo(x,hillY+Math.sin(x*.01)*30);ctx.lineTo(W,H+300);ctx.fill();
  ctx.fillStyle='#5fc28a';ctx.beginPath();ctx.moveTo(0,H+300);for(let x=0;x<=W;x+=20)ctx.lineTo(x,hillY+60+Math.sin(x*.015+2)*24);ctx.lineTo(W,H+300);ctx.fill()}
 // clouds
 clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>1.3)c.x=-.3;const y=H*.72-(c.y-cam.y*.6);if(y<-80||y>H+80)return;
  ctx.globalAlpha=clamp(1-(phase-2.2),0.15,.9);ctx.fillStyle='#fff';const x=c.x*W,s=c.s*30;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.arc(x+s*1.1,y+s*.2,s*.8,0,7);ctx.arc(x-s*1.1,y+s*.25,s*.7,0,7);ctx.arc(x+s*.3,y-s*.5,s*.75,0,7);ctx.fill();ctx.globalAlpha=1})}

const PCOL=[['#ffb86b','#e8833a'],['#7dd3fc','#3b9bd6'],['#c4a5ff','#8b63e6']];
function drawPlatform(row,p,dt){const x=laneX(p.i),y=toScreen(row.k*GAP);if(y<-80||y>H+120)return;
 const w=platW(),h=34;p.wob+=dt*2;
 if(p.shown<1)p.shown=Math.min(1,p.shown+dt*2.2);const pop=easeOut(p.shown);
 if(p.fade){p.fade=Math.max(0,p.fade-dt*1.5)}
 const alpha=p.fade!==undefined&&row.solved&&!p.glow?p.fade:1;if(alpha<=0)return;
 ctx.save();ctx.globalAlpha=alpha;
 let bob=Math.sin(p.wob+row.k)*3;let dy=0,rot=0;
 if(p.broken){p.broken+=dt;dy=p.broken*p.broken*900;rot=p.broken*2}
 ctx.translate(x,y+bob+dy);ctx.scale(pop,pop);
 if(p.broken){ // two halves falling apart
  [-1,1].forEach(s=>{ctx.save();ctx.translate(s*p.broken*60,0);ctx.rotate(s*rot);drawSlab(-w/4,0,w/2,h,'#9aa0b5','#6b7186',null);ctx.restore()});ctx.restore();return}
 const[c1,c2]=p.glow?['#7dffb0','#2ecc71']:p.reveal?['#7dffb0','#2ecc71']:PCOL[p.i];
 if(p.glow){p.glow=Math.max(.35,p.glow-dt*.5);ctx.shadowColor='#7dffb0';ctx.shadowBlur=30*p.glow}
 if(p.reveal&&!row.solved){ctx.shadowColor='#7dffb0';ctx.shadowBlur=20+Math.sin(tPlay*8)*10}
 drawSlab(0,0,w,h,c1,c2,row.ans?row.ans[p.i]:null);ctx.restore()}
function drawSlab(cx,cy,w,h,c1,c2,label){
 // shadow
 ctx.fillStyle='#00000022';rr(cx-w/2+6,cy+8,w,h,14);ctx.fill();
 // body
 ctx.fillStyle=c2;rr(cx-w/2,cy+6,w,h,14);ctx.fill();
 const g=ctx.createLinearGradient(0,cy-h/2,0,cy+h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;rr(cx-w/2,cy-2,w,h,14);ctx.fill();ctx.shadowBlur=0;
 // grass/ice top
 ctx.fillStyle='#ffffff66';rr(cx-w/2+8,cy+1,w-16,6,3);ctx.fill();
 if(label){ctx.fillStyle='#22163f';let fs=20;ctx.font=`800 ${fs}px "Baloo Bhaijaan 2",system-ui`;while(ctx.measureText(label).width>w-18&&fs>11){fs--;ctx.font=`800 ${fs}px "Baloo Bhaijaan 2",system-ui`}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction='ltr';ctx.fillText(label,cx,cy+h/2-1)}}

function drawPlayer(dt){const p=player;
 // animate jump/fall
 if(p.anim){const a=p.anim;a.t+=dt/a.dur;const t=clamp(a.t,0,1);
  if(a.phase==='up'){p.x=lerp(a.from.x,a.to.x,easeOut(t));const arc=Math.sin(t*Math.PI)*90;p.y=lerp(a.from.y,a.to.y,t)+arc;
   p.sy=lerp(p.sy,t<.5?1.25:.9,dt*10);p.sx=lerp(p.sx,t<.5?.8:1.1,dt*10);p.rot=(a.to.x-a.from.x)*.002*Math.sin(t*Math.PI)}
  else{p.x=lerp(a.from.x,a.to.x,t);p.y=lerp(a.from.y,a.to.y,t)+Math.sin(t*Math.PI)*30;p.rot=Math.sin(t*20)*.3}
  p.trail.push({x:p.x,y:p.y,l:.35});
  if(t>=1){if(a.phase==='up')land();else{p.anim=null;p.y=a.to.y;p.sx=1.4;p.sy=.6;p.rot=0;snd('land');setTimeout(()=>{if(state==='play')p.face='idle'},500)}}}
 else{p.sx=lerp(p.sx,1+Math.sin(tPlay*3)*.03,dt*8);p.sy=lerp(p.sy,1-Math.sin(tPlay*3)*.03,dt*8);p.rot=lerp(p.rot||0,0,dt*8)}
 // trail
 p.trail.forEach(t=>t.l-=dt);p.trail=p.trail.filter(t=>t.l>0);
 p.trail.forEach(t=>{ctx.globalAlpha=t.l*1.4;ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(t.x,toScreen(t.y)-30,22*t.l*2,0,7);ctx.fill()});ctx.globalAlpha=1;
 const sx=p.x,sy=toScreen(p.y);
 // ground shadow on current platform
 const base=toScreen(p.anim?p.anim.to.y:p.y);ctx.fillStyle='#00000026';ctx.beginPath();ctx.ellipse(p.anim?p.anim.to.x:sx,base+2,30,7,0,0,7);ctx.fill();
 ctx.save();ctx.translate(sx,sy);ctx.rotate(p.rot||0);ctx.scale(p.sx,p.sy);
 const R=30;
 // feet
 const step=p.anim?Math.sin(p.anim.t*Math.PI*2)*6:0;ctx.fillStyle='#ff7a59';
 ctx.beginPath();ctx.ellipse(-12,-4+step,10,6,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(12,-4-step,10,6,0,0,7);ctx.fill();
 // body
 const bg=ctx.createRadialGradient(-10,-R-14,4,0,-R,R*1.2);bg.addColorStop(0,'#ffe27a');bg.addColorStop(1,'#ffb01f');
 ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,-R,R,R*1.05,0,0,7);ctx.fill();
 ctx.strokeStyle='#e08a00';ctx.lineWidth=2;ctx.stroke();
 // graduation cap
 ctx.fillStyle='#22163f';ctx.beginPath();ctx.moveTo(-26,-R*2+2);ctx.lineTo(0,-R*2-10);ctx.lineTo(26,-R*2+2);ctx.lineTo(0,-R*2+12);ctx.closePath();ctx.fill();
 ctx.fillRect(-12,-R*2+2,24,9);
 const tas=Math.sin(tPlay*4)*4;ctx.strokeStyle='#ffc83d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-R*2-4);ctx.quadraticCurveTo(18,-R*2-2,20+tas*.3,-R*2+14);ctx.stroke();
 ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.arc(20+tas*.3,-R*2+15,3,0,7);ctx.fill();
 // cheeks
 ctx.fillStyle='#ff8a8a88';ctx.beginPath();ctx.ellipse(-18,-R+6,6,4,0,0,7);ctx.ellipse(18,-R+6,6,4,0,0,7);ctx.fill();
 // eyes
 p.blink-=dt;if(p.blink<-3)p.blink=.12;
 const lookX=p.anim?clamp((p.anim.to.x-p.anim.from.x)*.03,-4,4):Math.sin(tPlay*.7)*2;
 ctx.fillStyle='#22163f';ctx.strokeStyle='#22163f';ctx.lineWidth=3;ctx.lineCap='round';
 [-10,10].forEach(ex=>{const x=ex+lookX,y=-R-4;
  if(p.face==='happy'){ctx.beginPath();ctx.arc(x,y+2,5,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}
  else if(p.face==='dizzy'){ctx.beginPath();ctx.moveTo(x-4,y-4);ctx.lineTo(x+4,y+4);ctx.moveTo(x+4,y-4);ctx.lineTo(x-4,y+4);ctx.stroke()}
  else if(p.blink>0){ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.stroke()}
  else{ctx.beginPath();ctx.ellipse(x,y,4.5,p.face==='focus'?6.5:5.5,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+1.5,y-2,1.6,0,7);ctx.fill();ctx.fillStyle='#22163f'}});
 // mouth
 ctx.beginPath();if(p.face==='happy'){ctx.fillStyle='#c2410c';ctx.arc(lookX,-R+8,7,0,Math.PI);ctx.fill()}
 else if(p.face==='dizzy'){ctx.ellipse(lookX,-R+10,4,5,0,0,7);ctx.stroke()}
 else if(p.face==='focus'){ctx.moveTo(lookX-4,-R+9);ctx.lineTo(lookX+4,-R+9);ctx.stroke()}
 else{ctx.arc(lookX,-R+6,5,.2,Math.PI-.2);ctx.stroke()}
 // dizzy stars
 if(p.face==='dizzy'){for(let i=0;i<3;i++){const a=tPlay*6+i*2.1;ctx.fillStyle='#ffc83d';ctx.font='16px system-ui';ctx.fillText('★',Math.cos(a)*26-6,-R*2-18+Math.sin(a)*6)}}
 ctx.restore()}

function drawFx(dt){
 parts.forEach(p=>{p.life-=dt;p.vy+=(p.g||0)*dt;
  if(p.screen){p.sx+=p.vx*dt;p.sy+=p.vy*dt;p.vx*=.98;p.rot+=p.vr*dt;ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.translate(p.sx,p.sy);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r,p.r,p.r*2);ctx.restore()}
  else{p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,toScreen(p.y),p.r,0,7);ctx.fill()}});
 ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);
 floaters.forEach(f=>{f.life-=dt;f.y+=dt*60;ctx.globalAlpha=clamp(f.life,0,1);const s=1+Math.max(0,f.life-1)*2;ctx.save();ctx.translate(f.x,toScreen(f.y));ctx.scale(s,s);
  ctx.font='800 34px "Baloo Bhaijaan 2",system-ui';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(f.txt,0,0);ctx.fillStyle=f.c;ctx.fillText(f.txt,0,0);ctx.restore()});
 ctx.globalAlpha=1;floaters=floaters.filter(f=>f.life>0)}

// ===== Loop =====
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;tPlay+=dt;
 if(!rows)reset();
 const targetCam=(player.anim&&player.anim.phase==='up'?player.anim.to.y:cur*GAP);cam.y=lerp(cam.y,targetCam,dt*3.5);
 shake=Math.max(0,shake-dt);
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
 drawBg(dt);
 rows.forEach(r=>{if(r.k===0){drawGround()}else r.plats.forEach(p=>drawPlatform(r,p,dt))});
 drawPlayer(dt);drawFx(dt);ctx.restore();
 if(flash){ctx.fillStyle=flash;ctx.globalAlpha=.35;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flash=null}
 if(state==='menu'){player.face=Math.sin(tPlay)>0?'happy':'idle'}}
function drawGround(){const y=toScreen(0);if(y>H+60)return;ctx.fillStyle='#4caf50';rr(-20,y+4,W+40,H,0);ctx.fill();ctx.fillStyle='#6fd27a';ctx.fillRect(0,y+4,W,14);
 for(let x=10;x<W;x+=26){ctx.fillStyle='#3e9a47';ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x+5,y+6);ctx.lineTo(x+10,y+18);ctx.fill()}}
requestAnimationFrame(frame);

// ===== UI wiring =====
function showBest(){const b=store.get('jbest');$('best').innerHTML=b?`<div class="chip" style="color:#22163f">⭐ أعلى ارتفاع: ${b} م</div>`:''}
showBest();
function start(){['menu','over','editor'].forEach(id=>$(id).classList.add('hidden'));reset();state='play';player.face='idle';snd('good')}
$('play').onclick=$('again').onclick=start;
$('home').onclick=()=>{$('over').classList.add('hidden');$('menu').classList.remove('hidden');state='menu';reset();$('q').classList.add('out');showBest()};
$('editBtn').onclick=()=>{$('qText').value=store.get('jq')||DEFAULT_Q;$('menu').classList.add('hidden');$('editor').classList.remove('hidden')};
$('saveQ').onclick=()=>{const p=parseQ($('qText').value);if(!p.length){$('qText').style.outline='3px solid #ff5468';return}questions=p;store.set('jq',$('qText').value);$('editor').classList.add('hidden');$('menu').classList.remove('hidden');reset();$('q').classList.add('out')};
$('resetQ').onclick=()=>{$('qText').value=DEFAULT_Q};
$('q').classList.add('out');
</script>
