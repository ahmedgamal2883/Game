<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>سباق المذاكرة</title>
<style>
  :root{--ink:#1f2340;--accent:#6c5ce7;--bg:#fdf6e3}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--ink);touch-action:none}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none;font-weight:700}
  #hearts{font-size:24px;letter-spacing:4px;color:#e74c3c}
  #score{background:#fff;border-radius:20px;padding:6px 14px;box-shadow:0 2px 6px #0002}
  #question{position:fixed;top:60px;left:50%;transform:translateX(-50%);max-width:min(560px,92vw);background:#fff;border:4px solid var(--ink);border-radius:10px;padding:12px 18px;text-align:center;font-weight:700;font-size:18px;box-shadow:0 6px 0 var(--ink);display:none}
  #toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;pointer-events:none;opacity:0;transition:opacity .3s}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fdf6e3ee;padding:16px;text-align:center}
  .screen h1{font-size:42px;color:var(--accent)}
  .screen p{max-width:460px;line-height:1.7}
  button{font:inherit;font-weight:800;font-size:20px;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 34px;box-shadow:0 5px 0 #4834d4;cursor:pointer}
  button.sec{background:#fff;color:var(--ink);box-shadow:0 5px 0 #ccc;font-size:16px;padding:8px 20px}
  textarea{width:min(560px,92vw);height:200px;font:14px monospace;padding:10px;border-radius:10px;border:2px solid #ccc;direction:ltr}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="hud"><div id="hearts"></div><div id="score">0 نقطة</div></div>
<div id="question"></div>
<div id="toast"></div>

<div id="menu" class="screen">
  <h1>سباق المذاكرة 🏃</h1>
  <p>اجري على المكتب، اتفادى الأستيكة والكتب، ولما توصل للوحة السؤال ادخل في حارة الإجابة الصح.<br>
  ⬅️ ➡️ للتحرك — ⬆️ أو مسافة للقفز — أو اسحب بصباعك على الموبايل.</p>
  <button id="play">ابدأ</button>
  <button class="sec" id="editBtn">أسئلتي</button>
</div>

<div id="editor" class="screen hidden">
  <h2>أضف أسئلتك</h2>
  <p>كل سؤال في سطر: السؤال | الإجابة الصح | خطأ 1 | خطأ 2</p>
  <textarea id="qText"></textarea>
  <div style="display:flex;gap:10px"><button id="saveQ">حفظ</button><button class="sec" id="resetQ">الافتراضي</button></div>
</div>

<div id="over" class="screen hidden">
  <h1>انتهت اللعبة</h1>
  <p id="final"></p>
  <button id="again">العب تاني</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Questions ----------
const DEFAULT_Q = `Lower limb veins connecting superficial to deep veins are called? | Perforators | Capillaries | Lymphatics
First-line investigation for suspected varicose veins? | Duplex ultrasound | Venography | MRI
Normal adult resting heart rate (bpm)? | 60-100 | 30-50 | 110-150
Largest organ of the body? | Skin | Liver | Brain
Insulin is secreted by which cells? | Beta cells | Alpha cells | Delta cells
Normal fasting blood glucose (mg/dL)? | 70-100 | 140-180 | 30-50
Which vitamin deficiency causes scurvy? | Vitamin C | Vitamin D | Vitamin K
The most common blood type? | O+ | AB- | B-`;
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function parseQ(t){return t.split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(p=>p.length>=4&&p[0]).map(p=>({q:p[0],a:p[1],w:[p[2],p[3]]}))}
let questions = parseQ(store.get('qs')||DEFAULT_Q); if(!questions.length) questions=parseQ(DEFAULT_Q);

// ---------- Three setup ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background=new THREE.Color(0xfdf6e3); scene.fog=new THREE.Fog(0xfdf6e3,40,90);
const camera = new THREE.PerspectiveCamera(60,1,0.1,200); camera.position.set(0,4.5,7); camera.lookAt(0,1,-6);
scene.add(new THREE.HemisphereLight(0xffffff,0xe8d9b5,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(5,10,5); sun.castShadow=true; scene.add(sun);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?80:60;camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize();

const M=c=>new THREE.MeshLambertMaterial({color:c});
// desk
const desk=new THREE.Mesh(new THREE.PlaneGeometry(200,300),M(0xf3d9a4)); desk.rotation.x=-Math.PI/2; desk.position.y=-0.02; desk.receiveShadow=true; scene.add(desk);
// paper track with lines (texture)
const pc=document.createElement('canvas'); pc.width=256; pc.height=256; const px=pc.getContext('2d');
px.fillStyle='#f4f2ff';px.fillRect(0,0,256,256);px.fillStyle='#3b3f7a';[0,85,170,253].forEach(x=>px.fillRect(x,0,3,256));
px.fillStyle='#d3d0f0';for(let y=0;y<256;y+=32)px.fillRect(0,y,256,1);
const ptex=new THREE.CanvasTexture(pc); ptex.wrapT=THREE.RepeatWrapping; ptex.repeat.set(1,30);
const track=new THREE.Mesh(new THREE.PlaneGeometry(6.6,300),new THREE.MeshLambertMaterial({map:ptex})); track.rotation.x=-Math.PI/2; track.position.z=-140; track.receiveShadow=true; scene.add(track);

// player: original round blob with ears
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.SphereGeometry(0.6,24,16),M(0x6c5ce7)); body.scale.y=1.15; body.position.y=0.7; body.castShadow=true; player.add(body);
[-0.3,0.3].forEach(x=>{const e=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.4,10),M(0x6c5ce7));e.position.set(x,1.4,0);player.add(e)});
const feet=[-0.25,0.25].map(x=>{const f=new THREE.Mesh(new THREE.SphereGeometry(0.18,10,8),M(0x4834d4));f.position.set(x,0.12,0);player.add(f);return f});
scene.add(player);

// scenery
const scenery=[];
function book(x,z){const g=new THREE.Group();const n=2+Math.random()*4|0;let y=0;const cols=[0xe17055,0x00b894,0x0984e3,0xfdcb6e,0xe84393,0xffffff];
 for(let i=0;i<n;i++){const h=0.3+Math.random()*0.3;const b=new THREE.Mesh(new THREE.BoxGeometry(2.5+Math.random(),h,1.8),M(cols[Math.random()*6|0]));b.position.y=y+h/2;b.rotation.y=(Math.random()-.5)*.3;b.castShadow=true;g.add(b);y+=h}
 g.position.set(x,0,z);scene.add(g);scenery.push(g)}
function cactus(x,z){const g=new THREE.Group();const p=new THREE.Mesh(new THREE.CylinderGeometry(.4,.3,.6,12),M(0xd35400));p.position.y=.3;g.add(p);
 const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1,10),M(0x27ae60));c.position.y=1.1;g.add(c);g.position.set(x,0,z);scene.add(g);scenery.push(g)}
for(let z=0;z>-90;z-=7){const s=Math.random()<.5?-1:1;(Math.random()<.75?book:cactus)(s*(5+Math.random()*3),z)}

// ---------- Game objects ----------
const LANES=[-2.2,0,2.2];
let objs=[], state='menu', speed, lane, px_, vy, py, score, lives, dist, nextQ, qActive, qIdx, invuln;
function textTex(txt,w,h,fs){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,w,h);x.strokeStyle='#1f2340';x.lineWidth=12;x.strokeRect(0,0,w,h);
 x.fillStyle='#1f2340';x.textAlign='center';x.textBaseline='middle';let f=fs;x.font=`bold ${f}px system-ui`;
 while(x.measureText(txt).width>w-30&&f>14){f-=2;x.font=`bold ${f}px system-ui`}x.fillText(txt,w/2,h/2);return new THREE.CanvasTexture(c)}
function addEraser(z){const l=Math.random()*3|0;const m=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.6,0.8),M(0xff7eb6));m.position.set(LANES[l],0.3,z);m.castShadow=true;
 const s=new THREE.Mesh(new THREE.BoxGeometry(1.42,0.62,0.3),M(0x74b9ff));s.position.x=0.3;m.add(s);scene.add(m);objs.push({mesh:m,type:'ob',lane:l})}
function addGate(z){const q=questions[qIdx++%questions.length];const ans=[q.a,...q.w].sort(()=>Math.random()-.5);
 const g=new THREE.Group();ans.forEach((a,i)=>{const s=new THREE.Mesh(new THREE.PlaneGeometry(1.9,0.9),new THREE.MeshBasicMaterial({map:textTex(a,380,180,52)}));s.position.set(LANES[i],2.1,0);g.add(s);
  [-0.8,0.8].forEach(dx=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.08,1.7,.08),M(0x1f2340));p.position.set(LANES[i]+dx,0.85,0);g.add(p)})});
 g.position.z=z;scene.add(g);objs.push({mesh:g,type:'gate',q,ans,announced:false})}

function reset(){objs.forEach(o=>scene.remove(o.mesh));objs=[];speed=12;lane=1;px_=0;vy=0;py=0;score=0;lives=3;dist=0;nextQ=60;qIdx=Math.random()*questions.length|0;invuln=0;
 for(let z=-25;z>-90;z-=12)addEraser(z);updHud()}
function updHud(){hearts.textContent='♥'.repeat(lives)+'♡'.repeat(Math.max(0,3-lives));document.getElementById('score').textContent=score+' نقطة'}
function toast(t,c){const e=document.getElementById('toast');e.textContent=t;e.style.color=c;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,700)}
function hurt(){if(invuln>0)return;lives--;invuln=1.2;updHud();if(lives<=0)end()}
function end(){state='over';document.getElementById('question').style.display='none';document.getElementById('final').textContent='نتيجتك: '+score+' نقطة';document.getElementById('over').classList.remove('hidden')}

// ---------- Input ----------
function move(d){if(state!=='play')return;lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(state==='play'&&py<=0.001)vy=9}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jump()});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)<20&&Math.abs(dy)<20){move(tx<innerWidth/2?-1:1)}else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump()});

// ---------- Loop ----------
let last=performance.now(),t=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;
 if(state==='play'){
  speed=Math.min(26,speed+dt*0.25);const dz=speed*dt;dist+=dz;
  ptex.offset.y+=dz/10;
  px_+= (LANES[lane]-px_)*Math.min(1,dt*14);vy-=25*dt;py=Math.max(0,py+vy*dt);if(py===0)vy=Math.max(vy,0);
  player.position.set(px_,py,0);player.rotation.z=(LANES[lane]-px_)*-0.15;
  body.position.y=0.7+Math.abs(Math.sin(t*14))*0.08*(py===0);feet[0].position.z=Math.sin(t*14)*.2;feet[1].position.z=-Math.sin(t*14)*.2;
  player.visible=invuln>0?(t*20|0)%2===0:true;invuln-=dt;
  score+=Math.round(dz)>0?0:0;
  scenery.forEach(s=>{s.position.z+=dz;if(s.position.z>10)s.position.z-=95});
  // spawn
  let far=Math.min(0,...objs.map(o=>o.mesh.position.z));
  if(far>-80){const z=far-10-Math.random()*6;
   if(dist>nextQ&&!objs.some(o=>o.type==='gate')){addGate(z-10);nextQ=dist+120}else addEraser(z)}
  const qEl=document.getElementById('question');
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.mesh.position.z+=dz;const z=o.mesh.position.z;
   if(o.type==='ob'&&Math.abs(z)<0.6&&o.lane===lane&&py<0.6&&!o.hit){o.hit=true;hurt();toast('آخ!','#e74c3c')}
   if(o.type==='gate'){
    if(!o.announced&&z>-70){o.announced=true;qEl.textContent=o.q.q;qEl.style.display='block'}
    if(!o.done&&z>0){o.done=true;qEl.style.display='none';
     if(o.ans[lane]===o.q.a){score+=100;toast('صح! +100','#00b894')}else{toast('غلط: '+o.q.a,'#e74c3c');invuln=0;hurt()}updHud()}}
   if(z>12){scene.remove(o.mesh);objs.splice(i,1)}}
  // keep obstacles away from just before gates
  objs.filter(o=>o.type==='gate').forEach(g=>objs.forEach(o=>{if(o.type==='ob'&&Math.abs(o.mesh.position.z-g.mesh.position.z)<14){o.mesh.visible=false;o.hit=true}}));
 }
 renderer.render(scene,camera)}
requestAnimationFrame(loop);

// ---------- UI ----------
const $=id=>document.getElementById(id), hearts=$('hearts');
$('play').onclick=$('again').onclick=()=>{$('menu').classList.add('hidden');$('over').classList.add('hidden');reset();state='play'};
$('editBtn').onclick=()=>{$('qText').value=store.get('qs')||DEFAULT_Q;$('menu').classList.add('hidden');$('editor').classList.remove('hidden')};
$('saveQ').onclick=()=>{const p=parseQ($('qText').value);if(!p.length){alert('مفيش أسئلة صحيحة');return}questions=p;store.set('qs',$('qText').value);$('editor').classList.add('hidden');$('menu').classList.remove('hidden')};
$('resetQ').onclick=()=>{$('qText').value=DEFAULT_Q};
</script>
</body>
</html>
